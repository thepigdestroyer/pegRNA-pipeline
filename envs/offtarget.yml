name: pegrna-ngrna
# R environment for off-target scoring via Bioconductor crisprScore/crisprDesign.
# After creation run the R install block below once:
#
#   conda activate pegrna-ngrna
#   Rscript -e "
#     options(repos = BiocManager::repositories())
#     BiocManager::install(c(
#       'crisprScore', 'crisprDesign', 'Biostrings',
#       'BSgenome.Hsapiens.UCSC.hg38'
#     ), ask = FALSE)
#   "
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  - r-biocmanager
  - r-data.table
  - bioconductor-genomicranges
