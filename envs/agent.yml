name: pegrna-agent
# Laptop-side control agent. Install after activating:
#   pip install -e /path/to/pegRNA-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - click>=8.1
      - pyyaml>=6.0
      - python-codon-tables>=0.1.12
      - biopython>=1.83
      - pandas>=2.0
      - sqlalchemy>=2.0
      - paramiko>=3.0
