[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pegrna_pipeline"
version = "1.0.0a1"
description = "Automated pegRNA design pipeline for prime editing C-terminal tagging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mrinal Joshi", email = "mrinal.joshi@ukdri.ac.uk" },
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-codon-tables>=0.1.12",
    "biopython>=1.83",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "paramiko>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-mock>=3",
    "ruff>=0.5",
    "black>=24",
]
scarless = [
    "ViennaRNA>=2.6",
]
recode = [
    "dnachisel>=3.2",
]
splice = [
    "spliceai>=1.3",
    "tensorflow>=2.6",
    # maxentpy (MaxEntScan, primary cryptic-splice gate) is NOT pip-installable on
    # Python 3.11 (broken C ext); it is staged pure-Python from source by
    # scripts/hpc/stage_models.sh (like RiNALMo/RNAformer/Boltz).
]
importance = [
    "biotite>=0.40",
]
fullstructure = [
    "torch>=2.0",
]
complex = [
    "boltz>=2.0",
]
report = [
    "python-docx>=1.1",
]

[project.scripts]
pegrna = "pegrna_pipeline.agent.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pegrna_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/pegrna_pipeline/data" = "pegrna_pipeline/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
