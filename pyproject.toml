[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pegrna_pipeline"
version = "1.0.0a1"
description = "Automated pegRNA design pipeline for prime editing C-terminal tagging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mrinal Joshi", email = "mrinal.joshi@ukdri.ac.uk" },
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-codon-tables>=0.1.12",
    "biopython>=1.83",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "paramiko>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-mock>=3",
    "ruff>=0.5",
    "black>=24",
    # Web layer (FastAPI TestClient) so tests/test_web_app.py runs in CI. These
    # are light; the heavy api-mode model stack is NOT needed for the web tests
    # (they mock the pipeline subprocess).
    "fastapi>=0.110",
    "httpx>=0.27",
]
scarless = [
    "ViennaRNA>=2.6",
]
recode = [
    "dnachisel>=3.2",
]
splice = [
    "spliceai>=1.3",
    "tensorflow>=2.6",
    # SpliceAI ships legacy Keras-2 .h5 weights. TensorFlow >= 2.16 makes `keras`
    # Keras 3, which cannot load them, so the adapter prefers this Keras-2 shim.
    "tf-keras>=2.16",
    # spliceai's own __init__ imports pkg_resources, removed in setuptools >= 81.
    "setuptools<81",
    # maxentpy (MaxEntScan, primary cryptic-splice gate) is NOT pip-installable on
    # Python >= 3.11 (its pre-generated Cython _hashseq.c uses the private
    # longintrepr.h). The pure-Python scorer is all the pipeline uses, so install
    # the vendored copy without its C extension:
    #     scripts/install_maxentpy.sh
]
importance = [
    "biotite>=0.40",
]
fullstructure = [
    "torch>=2.0",
]
complex = [
    "boltz>=2.0",
]
report = [
    "python-docx>=1.1",
]

[project.scripts]
pegrna = "pegrna_pipeline.agent.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pegrna_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"src/pegrna_pipeline/data" = "pegrna_pipeline/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored third-party source — keep it byte-identical to upstream.
extend-exclude = ["web/maxentpy_src"]

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's *default* selection has widened over time,
# so leaving this implicit means `ruff check` reports a different set of errors
# depending on which ruff the CI runner happens to resolve -- the repo went from
# clean to 754 errors without a line of source changing. These are the rules the
# codebase was written and reviewed against; widen deliberately, not by upgrade.
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]
# Vendored third-party source — keep it byte-identical to upstream.
force-exclude = "web/maxentpy_src"
